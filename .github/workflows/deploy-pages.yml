name: Deploy B*alance to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      # Vorschau der überarbeiteten Startseite unter /neu/, neben der Live-Version.
      # Erst nach dem Live-Build auschecken: Der Ordner liegt im Workspace, und
      # tsconfig.json schließt "**/*.ts" ein – vorher würde der Live-Build die
      # Vorschau mitprüfen. Zum Abschalten den Branch löschen oder die Schritte
      # entfernen; fehlt der Branch, läuft nur die Live-Version.
      - name: Check for preview branch
        id: preview
        run: |
          if git ls-remote --exit-code --heads origin "$PREVIEW_BRANCH" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PREVIEW_BRANCH: startseite-redesign

      - name: Checkout preview
        if: steps.preview.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: startseite-redesign
          path: preview

      - name: Build preview
        if: steps.preview.outputs.exists == 'true'
        working-directory: preview
        run: |
          npm ci
          npm run build:pages
          mkdir -p ../out/neu
          cp -R out/. ../out/neu/
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/neu
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/neu
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
